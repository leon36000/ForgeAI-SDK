name: cleanup-router-marker-0.3.0-alpha.1

on:
  push:
    branches:
      - forgeai/router-marker-cleanup-0.3.0-alpha.1

permissions:
  contents: write

env:
  TARGET_BRANCH: forgeai/mcp-litellm-router-0.3.0-alpha.1
  PARENT_SHA: 6ac83d0707cda99dc069000bb4cec79caad4f6a3

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target router branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Remove accidental marker and reseal manifest
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PARENT_SHA" HEAD
          test -f docs/.router-pr-marker
          rm docs/.router-pr-marker
          node scripts/source-manifest.mjs
          git add -A
          git diff --cached --check
          git config user.name 'ForgeAI Release Bot'
          git config user.email 'forgeai-release@users.noreply.github.com'
          git commit -m 'chore: remove accidental router marker'
          npm test
          npm run lint
          npm run verify
          grep -q '^PASS ' verification/VERIFIED
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Push clean target branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'HEAD=%s\nTREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
