name: forgeai-source-export

on:
  push:
    branches:
      - forgeai/source-export-0.1.3

permissions:
  contents: read

env:
  RELEASE_SHA: 7f635721a0958cd92ad970c0010b363a09200c86

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
      - name: Verify and archive exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          tar --exclude=.git -czf "$RUNNER_TEMP/forgeai-source-$RELEASE_SHA.tar.gz" .
          sha256sum "$RUNNER_TEMP/forgeai-source-$RELEASE_SHA.tar.gz" > "$RUNNER_TEMP/forgeai-source-$RELEASE_SHA.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: forgeai-source-7f635721
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/forgeai-source-${{ env.RELEASE_SHA }}.tar.gz
            ${{ runner.temp }}/forgeai-source-${{ env.RELEASE_SHA }}.tar.gz.sha256
