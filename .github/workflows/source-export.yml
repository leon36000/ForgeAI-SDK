name: forgeai-source-export

on:
  push:
    branches:
      - forgeai/source-export-0.1.3

permissions:
  contents: read

env:
  RELEASE_SHA: 6ac83d0707cda99dc069000bb4cec79caad4f6a3
  RELEASE_TREE: dbfe76b324c955089eb87e125bd4bdb5e1dbaa9a

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
      - name: Verify and archive exact control-plane source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          tar --exclude=.git -czf "$RUNNER_TEMP/forgeai-source-$RELEASE_SHA.tar.gz" .
          sha256sum "$RUNNER_TEMP/forgeai-source-$RELEASE_SHA.tar.gz" > "$RUNNER_TEMP/forgeai-source-$RELEASE_SHA.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: forgeai-source-6ac83d07
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/forgeai-source-${{ env.RELEASE_SHA }}.tar.gz
            ${{ runner.temp }}/forgeai-source-${{ env.RELEASE_SHA }}.tar.gz.sha256
