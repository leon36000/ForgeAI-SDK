name: forgeai-source-export

on:
  push:
    branches:
      - forgeai/source-export-0.1.3
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  RELEASE_SHA: 25105445c1302ca002ac2532ec4ba10b16733126
  RELEASE_TREE: 925cb1097668874865a68c536c656da3ad504f07

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
      - name: Verify and archive exact Foundation source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          tar --exclude=.git -czf "$RUNNER_TEMP/forgeai-source-$RELEASE_SHA.tar.gz" .
          sha256sum "$RUNNER_TEMP/forgeai-source-$RELEASE_SHA.tar.gz" > "$RUNNER_TEMP/forgeai-source-$RELEASE_SHA.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: forgeai-source-25105445
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/forgeai-source-${{ env.RELEASE_SHA }}.tar.gz
            ${{ runner.temp }}/forgeai-source-${{ env.RELEASE_SHA }}.tar.gz.sha256
