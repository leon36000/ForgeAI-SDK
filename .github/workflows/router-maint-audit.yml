name: forgeai-maint003-unused-export-investigation

on:
  push:
    branches:
      - forgeai/router-maint-audit-0.3.0-alpha.1

permissions:
  contents: read

env:
  RELEASE_SHA: ef87a1603c309a9072de54bbdcb7fad2f3df6dba
  RELEASE_TREE: a72fe77b866bcbe9bc0c88da701b537a0eec9ecc
  FALLOW_VERSION: '3.10.0'

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"
      - name: Trace all remaining Fallow unused exports
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/maint003-unused-exports"
          mkdir -p "$evidence/traces"
          cat > "$evidence/targets.tsv" <<'EOF'
          src/command.mjs	COMMAND_LIMITS
          src/contracts.mjs	TASK_SCHEMA_VERSION
          src/contracts.mjs	ROLES
          src/contracts.mjs	MODES
          src/contracts.mjs	RISKS
          src/contracts.mjs	CONTRACT_LIMITS
          src/evidence.mjs	EVIDENCE_LIMITS
          src/file-tree.mjs	FILE_TREE_LIMITS
          src/glob.mjs	GLOB_LIMITS
          src/ledger.mjs	LEDGER_GENESIS
          src/ledger.mjs	LEDGER_LIMITS
          src/policy.mjs	normalizeRepoPath
          src/policy.mjs	POLICY_CONSTANTS
          src/utils.mjs	normalizeWhitespace
          src/utils.mjs	UTILITY_LIMITS
          tests/litellm-router-helpers.mjs	EVIDENCE_HASH
          EOF
          : > "$evidence/status.tsv"
          : > "$evidence/references.tsv"
          while IFS=$'\t' read -r file symbol; do
            slug="$(printf '%s__%s' "$file" "$symbol" | tr '/.' '__')"
            set +e
            npx -y "fallow@$FALLOW_VERSION" dead-code --trace "$file:$symbol" --format json --quiet 2>/dev/null > "$evidence/traces/$slug.json"
            status=$?
            set -e
            test "$status" -ne 2
            printf '%s\t%s\t%s\n' "$file" "$symbol" "$status" >> "$evidence/status.tsv"
            refs="$(rg -n --hidden --glob '!SOURCE_MANIFEST.json' --glob '!.git/**' --glob '!node_modules/**' "\\b${symbol}\\b" . || true)"
            count="$(printf '%s\n' "$refs" | sed '/^$/d' | wc -l | tr -d ' ')"
            printf '%s\t%s\t%s\n' "$file" "$symbol" "$count" >> "$evidence/references.tsv"
            printf '%s\n' "$refs" > "$evidence/traces/$slug.rg.txt"
          done < "$evidence/targets.tsv"
          set +e
          npx -y "fallow@$FALLOW_VERSION" dead-code --format json --quiet --unused-exports --explain 2>/dev/null > "$evidence/dead-code.json"
          dead_status=$?
          set -e
          test "$dead_status" -ne 2
          printf 'dead_code_exit=%s\n' "$dead_status" > "$evidence/exit-codes.txt"
          sha256sum "$evidence"/dead-code.json "$evidence"/traces/*.json > "$evidence/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: forgeai-maint003-unused-export-investigation-ef87a160
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/maint003-unused-exports
