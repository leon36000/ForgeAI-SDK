name: forgeai-maint002-fallow-investigation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  RELEASE_SHA: 27418e312048858ca4804ec97509ba8b810ddd05
  RELEASE_TREE: 71b3d102789ab426571aab7ab972eab40452eaa7
  FALLOW_VERSION: '3.10.0'

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"
      - name: Collect Fallow dead-code evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p maint002-evidence
          set +e
          npx -y "fallow@$FALLOW_VERSION" dead-code --trace src/litellm-router/contracts.mjs:CONTRACT_PATTERNS --format json --quiet 2>/dev/null > maint002-evidence/contract-patterns-trace.json
          trace_status=$?
          npx -y "fallow@$FALLOW_VERSION" list --entry-points --format json --quiet 2>/dev/null > maint002-evidence/entry-points.json
          entry_status=$?
          npx -y "fallow@$FALLOW_VERSION" dead-code --format json --quiet --unused-files --unused-exports --explain 2>/dev/null > maint002-evidence/dead-code.json
          dead_status=$?
          npx -y "fallow@$FALLOW_VERSION" config-schema --format json --quiet 2>/dev/null > maint002-evidence/config-schema.json
          schema_status=$?
          set -e
          printf 'trace=%s\nentry=%s\ndead=%s\nschema=%s\n' "$trace_status" "$entry_status" "$dead_status" "$schema_status" > maint002-evidence/exit-codes.txt
          test "$trace_status" -ne 2
          test "$entry_status" -ne 2
          test "$dead_status" -ne 2
          test "$schema_status" -ne 2
          sha256sum maint002-evidence/*.json > maint002-evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: forgeai-maint002-fallow-investigation-27418e31
          retention-days: 14
          if-no-files-found: error
          path: maint002-evidence
