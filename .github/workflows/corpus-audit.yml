name: forgeai-litellm-corpus-audit-0.3.2-alpha.1

on:
  push:
    branches:
      - forgeai/corpus-audit-0.3.2-alpha.1

permissions:
  contents: read
  issues: write

env:
  TARGET_BRANCH: forgeai/litellm-qualification-corpus-0.3.2-alpha.1
  BASE_BRANCH: forgeai/litellm-qualification-0.3.1-alpha.1
  FALLOW_VERSION: '3.10.0'
  SUITE_PATH: benchmarks/litellm-readonly/code-review-v1/suite.json
  MANIFEST_PATH: benchmarks/litellm-readonly/code-review-v1/manifest.json

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve exact draft PR authority
        id: authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/corpus-audit"
          mkdir -p "$evidence"
          curl --proto '=https' --tlsv1.2 --fail-with-body --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${TARGET_BRANCH}" \
            -o "$evidence/pulls.json"
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const evidence = `${process.env.RUNNER_TEMP}/corpus-audit`;
          const pulls = JSON.parse(readFileSync(`${evidence}/pulls.json`, 'utf8'));
          if (!Array.isArray(pulls) || pulls.length !== 1) throw new Error(`expected one open PR, found ${pulls?.length ?? 'invalid'}`);
          const pr = pulls[0];
          if (pr.head.ref !== process.env.TARGET_BRANCH || pr.base.ref !== process.env.BASE_BRANCH || pr.draft !== true) throw new Error('PR authority mismatch');
          const values = { pr_number: pr.number, head_sha: pr.head.sha, base_sha: pr.base.sha };
          writeFileSync(`${evidence}/authority.json`, `${JSON.stringify(values, null, 2)}\n`);
          writeFileSync(process.env.GITHUB_OUTPUT, Object.entries(values).map(([key,value])=>`${key}=${value}`).join('\n')+'\n', { flag:'a' });
          NODE
      - name: Checkout exact corpus HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.authority.outputs.head_sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify stack and clean source
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/corpus-audit"
          test "$(git rev-parse HEAD)" = '${{ steps.authority.outputs.head_sha }}'
          git fetch origin "$BASE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = '${{ steps.authority.outputs.base_sha }}'
          git merge-base --is-ancestor '${{ steps.authority.outputs.base_sha }}' HEAD
          printf '%s\n' "$(git rev-parse HEAD)" > "$evidence/HEAD"
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > "$evidence/TREE"
          printf '%s\n' '${{ steps.authority.outputs.base_sha }}' > "$evidence/BASE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Run full native gates
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/corpus-audit"
          npm test | tee "$evidence/tests.log"
          npm run lint | tee "$evidence/lint.log"
          npm run verify | tee "$evidence/verify.log"
          grep -q '^PASS ' verification/VERIFIED
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Validate sealed corpus invariants
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/corpus-audit"
          node bin/forgeai-litellm-corpus.mjs validate --suite "$SUITE_PATH" --manifest "$MANIFEST_PATH" | tee "$evidence/corpus-validation.json"
          node --input-type=module - <<'NODE' | tee "$RUNNER_TEMP/corpus-audit/corpus-audit.json"
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const suiteBytes = readFileSync(process.env.SUITE_PATH);
          const suite = JSON.parse(suiteBytes);
          const manifest = JSON.parse(readFileSync(process.env.MANIFEST_PATH, 'utf8'));
          const counts = {};
          const codes = new Set();
          for (const item of manifest.cases) {
            counts[item.category] = (counts[item.category] ?? 0) + 1;
            for (const code of item.expected_codes) codes.add(code);
          }
          const ids = suite.cases.map((item)=>item.case_id ?? item.id);
          if (ids.length !== 30 || new Set(ids).size !== 30) throw new Error('corpus must contain exactly 30 unique cases');
          if (manifest.suite_sha256 !== createHash('sha256').update(suiteBytes).digest('hex')) throw new Error('suite hash mismatch');
          if (counts.clean < 8 || counts.defect < 12 || counts.needs_context < 3 || counts.prompt_injection < 2) throw new Error('category balance is below minimum');
          if (codes.size < 15) throw new Error('seeded defect taxonomy is too narrow');
          const changed = require('node:child_process').execFileSync('git', ['diff','--name-only','${{ steps.authority.outputs.base_sha }}...HEAD'], { encoding:'utf8' }).trim().split('\n').filter(Boolean);
          if (changed.includes('config/litellm-router-policy.json')) throw new Error('corpus PR modified operational policy');
          console.log(JSON.stringify({status:'PASS', cases:ids.length, counts, seeded_codes:[...codes].sort(), suite_sha256:manifest.suite_sha256, operational_policy_changed:false}, null, 2));
          NODE
      - name: Run Fallow audit
        id: fallow_audit
        shell: bash
        run: |
          set +e
          evidence="$RUNNER_TEMP/corpus-audit"
          npx -y "fallow@$FALLOW_VERSION" audit --base '${{ steps.authority.outputs.base_sha }}' --format json --quiet --explain > "$evidence/fallow-audit.json" 2> "$evidence/fallow-audit.stderr"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$evidence/fallow-audit.stderr" >&2
          cat "$evidence/fallow-audit.json"
          if [ "$status" -eq 2 ]; then exit 2; fi
      - name: Surface Fallow security candidates
        id: fallow_security
        shell: bash
        run: |
          set +e
          evidence="$RUNNER_TEMP/corpus-audit"
          npx -y "fallow@$FALLOW_VERSION" security --changed-since '${{ steps.authority.outputs.base_sha }}' --surface --format json --quiet > "$evidence/fallow-security.json" 2> "$evidence/fallow-security.stderr"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$evidence/fallow-security.stderr" >&2
          cat "$evidence/fallow-security.json"
          if [ "$status" -eq 2 ]; then exit 2; fi
      - name: Seal source and audit evidence
        id: seal
        shell: bash
        env:
          AUDIT_STATUS: ${{ steps.fallow_audit.outputs.status }}
          SECURITY_STATUS: ${{ steps.fallow_security.outputs.status }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/corpus-audit"
          tar --exclude=.git -czf "$evidence/source.tar.gz" .
          node --input-type=module - <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const e=`${process.env.RUNNER_TEMP}/corpus-audit`;
          const hash=(name)=>createHash('sha256').update(readFileSync(`${e}/${name}`)).digest('hex');
          const tests=Number(readFileSync(`${e}/tests.log`,'utf8').match(/^# tests (\d+)$/mu)?.[1]??0);
          if(!Number.isInteger(tests)||tests<1) throw new Error('invalid test count');
          const corpus=JSON.parse(readFileSync(`${e}/corpus-audit.json`,'utf8'));
          const report={
            schema_version:'forgeai.litellm-corpus-audit.v0.3.2-alpha.1',
            pr_number:Number('${{ steps.authority.outputs.pr_number }}'),
            head_sha:readFileSync(`${e}/HEAD`,'utf8').trim(),
            tree_sha:readFileSync(`${e}/TREE`,'utf8').trim(),
            base_sha:readFileSync(`${e}/BASE`,'utf8').trim(),
            tests,
            native_gates:'PASS',
            corpus,
            fallow_version:process.env.FALLOW_VERSION,
            fallow_exit_codes:{audit:Number(process.env.AUDIT_STATUS),security:Number(process.env.SECURITY_STATUS)},
            hashes:{tests:hash('tests.log'),lint:hash('lint.log'),verify:hash('verify.log'),corpus_validation:hash('corpus-validation.json'),fallow_audit:hash('fallow-audit.json'),fallow_security:hash('fallow-security.json'),source_archive:hash('source.tar.gz')},
            workflow_run_id:process.env.GITHUB_RUN_ID,
          };
          report.report_sha256=createHash('sha256').update(JSON.stringify(report)).digest('hex');
          writeFileSync(`${e}/metadata.json`,JSON.stringify(report,null,2)+'\n');
          const body=[
            '## Audit automatisé du corpus de qualification',
            '',
            `- HEAD : \`${report.head_sha}\``,
            `- tree : \`${report.tree_sha}\``,
            `- base harness : \`${report.base_sha}\``,
            `- tests : **${report.tests}/${report.tests} PASS**`,
            '- gates natives et validation du corpus : **PASS**',
            `- corpus : ${corpus.cases} cas; clean=${corpus.counts.clean}, defect=${corpus.counts.defect}, needs_context=${corpus.counts.needs_context}, prompt_injection=${corpus.counts.prompt_injection}`,
            `- codes injectés distincts : ${corpus.seeded_codes.length}`,
            '- policy opérationnelle modifiée : **non**',
            `- Fallow 3.10.0 : audit=${report.fallow_exit_codes.audit}, security=${report.fallow_exit_codes.security}`,
            `- source archive SHA-256 : \`${report.hashes.source_archive}\``,
            `- preuve agrégée SHA-256 : \`${report.report_sha256}\``,
            `- workflow run : \`${report.workflow_run_id}\``,
            '',
            'Cette preuve valide le corpus hors ligne; elle ne constitue aucun résultat de benchmark ou qualification de modèle.',
          ].join('\n');
          writeFileSync(`${e}/pr-comment.json`,JSON.stringify({body}));
          NODE
          sha256sum "$evidence"/* > "$evidence/SHA256SUMS.txt"
          cat "$evidence/metadata.json"
      - name: Upload corpus audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: forgeai-litellm-corpus-audit-0.3.2-alpha.1
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/corpus-audit
      - name: Comment exact corpus authority on PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail-with-body --retry 3 -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/${{ steps.authority.outputs.pr_number }}/comments" \
            --data-binary "@$RUNNER_TEMP/corpus-audit/pr-comment.json"
